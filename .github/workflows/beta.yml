name: FusionMCP beta suite

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install "mcp[cli]" "uvicorn[standard]" matplotlib numpy pytest pytest-asyncio httpx
      - name: Run beta suite (real MCP SSE protocol, both backends, headless stubs, Ollama auto-wire)
        run: pytest tests/  # conftest isolates the beta subset from the legacy upstream suite
